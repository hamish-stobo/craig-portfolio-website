<!-- Contact Section -->
<section id="contact" class="py-16 md:py-24 bg-gray-800">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl md:text-4xl font-heading font-bold text-gold-rush text-center mb-12">Contact Me</h2>
        
        <div class="flex justify-center gap-8">
            <a href="{{.Contact.LinkedIn}}" 
               target="_blank" 
               class="w-16 h-16 bg-gold-rush rounded-full flex items-center justify-center text-gray-800 hover:bg-deep-gold transition-colors duration-300">
                <i class="fab fa-linkedin-in text-2xl"></i>
            </a>
            <a href="{{.Contact.Email}}" 
               class="w-16 h-16 bg-gold-rush rounded-full flex items-center justify-center text-gray-800 hover:bg-deep-gold transition-colors duration-300">
                <i class="far fa-envelope text-2xl"></i>
            </a>
            <a href="{{.Contact.Phone}}" 
               class="w-16 h-16 bg-gold-rush rounded-full flex items-center justify-center text-gray-800 hover:bg-deep-gold transition-colors duration-300">
