<!-- About Section -->
<section id="about" class="py-20 bg-gradient-to-br from-ivory to-sky/30">
    <div class="container mx-auto px-4">
        <!-- Section Header -->
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-heading font-bold text-st-andrews-blue mb-4">About Me</h2>
            <div class="w-24 h-1 bg-gold-rush mx-auto rounded-full"></div>
        </div>
        
        <div class="max-w-6xl mx-auto">
            <!-- Main About Card -->
            <div class="card bg-white shadow-2xl border border-white/50">
                <div class="card-body p-8 md:p-12">
                    <div class="flex flex-col lg:flex-row items-center lg:items-start gap-12">
                        
                        <!-- Profile Image -->
                        <div class="flex-shrink-0">
                            <div class="avatar">
                                <div class="w-72 h-72 rounded-full ring ring-gold-rush ring-offset-4 ring-offset-white shadow-2xl">
                                    <img src="/static/images/craig-profile-photo.png" 
                                         alt="Craig Stobo - Professional Director" 
                                         loading="eager"
                                         class="object-cover"/>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Content Area -->
                        <div class="flex-1 w-full" x-data="{ activeTab: 'summary' }">
                            
                            <!-- Tab Navigation -->
                            <div class="tabs tabs-boxed mb-8 bg-sky/20 p-1">
                                <button @click="activeTab = 'summary'" 
                                        :class="activeTab === 'summary' ? 'tab-active' : ''"
                                        class="tab tab-lg font-semibold transition-all duration-300">
                                    <i class="fas fa-user mr-2"></i>
                                    Personal Summary
                                </button>
                                <button @click="activeTab = 'qualifications'" 
                                        :class="activeTab === 'qualifications' ? 'tab-active' : ''"
                                        class="tab tab-lg font-semibold transition-all duration-300">
                                    <i class="fas fa-graduation-cap mr-2"></i>
                                    Qualifications
                                </button>
                            </div>
                            
                            <!-- Tab Content -->
                            <div class="min-h-[200px]">
                                <!-- Personal Summary -->
                                <div x-show="activeTab === 'summary'" 
                                     x-transition:enter="transition ease-out duration-300"
                                     x-transition:enter-start="opacity-0 transform translate-y-4"
                                     x-transition:enter-end="opacity-1 transform translate-y-0"
                                     class="prose prose-lg max-w-none">
                                    <p class="text-st-andrews-blue/80 text-xl leading-relaxed font-body">
                                        {{.PersonalSummary}}
                                    </p>
                                </div>
                                
                                <!-- Qualifications -->
                                <div x-show="activeTab === 'qualifications'" 
                                     x-transition:enter="transition ease-out duration-300"
                                     x-transition:enter-start="opacity-0 transform translate-y-4"
                                     x-transition:enter-end="opacity-1 transform translate-y-0">
                                    <div class="grid gap-4">
                                        {{range .Qualifications}}
                                        <div class="card bg-gradient-to-r from-st-andrews-blue/5 to-gold-rush/5 border border-st-andrews-blue/10">
                                            <div class="card-body p-6">
                                                <div class="flex items-start gap-4">
                                                    <div class="badge badge-lg bg-gold-rush text-st-andrews-blue border-none">
                                                        <i class="fas fa-award"></i>
                                                    </div>
                                                    <span class="text-st-andrews-blue font-medium text-lg">{{.}}</span>
                                                </div>
                                            </div>
                                        </div>
                                        {{end}}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
