<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" href="/static/images/craig-profile-photo.png" type="image/png">
    
    <!-- Performance: Preload critical resources -->
    <link rel="preload" href="/static/images/landing-page/desktop-bg.webp" as="image" type="image/webp" media="(min-width: 768px)">
    <link rel="preload" href="/static/images/landing-page/desktop-bg.jpg" as="image" type="image/jpeg" media="(min-width: 768px)">
    <link rel="preload" href="/static/images/craig-profile-photo.png" as="image" type="image/png">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" as="style">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Primary colors
                        'st-andrews-blue': '#060d87',
                        'gold-rush': '#f4b142',
                        
                        // Secondary colors
                        'deep-blue': '#000044',
                        'deep-gold': '#ee8a07',
                        'true-blue': '#317bff',
                        'true-yellow': '#ffde46',
                        'sky': '#daebfc',
                        'ivory': '#fbf9ed',
                        
                        // Digital colors
                        'digital-blue': '#0000ff',
                        'digital-yellow': '#ffff00'
                    },
                    fontFamily: {
                        'heading': ['Playfair Display', 'serif'],
                        'body': ['Inter', 'sans-serif'],
                        'sans': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts - Professional Inter + Playfair Display for elegance -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        /* Custom animations */
        @keyframes slideBackground {
            0%, 20% { opacity: 1; }
            25%, 45% { opacity: 0; }
            50%, 70% { opacity: 0; }
            75%, 95% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .bg-slide-1 { animation: slideBackground 20s infinite 0s; }
        .bg-slide-2 { animation: slideBackground 20s infinite 5s; }
        .bg-slide-3 { animation: slideBackground 20s infinite 10s; }
        .bg-slide-4 { animation: slideBackground 20s infinite 15s; }
        
        .bg-slide {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        @keyframes bounce-arrow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .bounce-arrow {
            animation: bounce-arrow 2s ease-in-out infinite;
        }
        
        /* Custom shadows */
        .text-shadow {
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
